name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # Everything under schemas/: the class tree (schemas/did_v2/, any depth)
      # and the registries and generated files the viewer serves
      # (schemas/registry/, schemas/generated/: the index, the coverage ledger,
      # the decision families). They used to sit directly under schemas/ and
      # needed a line each, because `schemas/V_*/**` needs a directory segment;
      # one recursive pattern cannot miss a regenerated ledger or decisions file.
      - "schemas/**"
      # The V_eta shape panel's two markdown inputs (web/src/veta/sources.ts),
      # imported at build time. Same trap as the two files above: without
      # these lines, regenerating the final class set or editing a tenet would
      # deploy nothing and the panel would go on showing the old text.
      - "docs/generated/did_v2_final_class_set.md"
      - "docs/did_v2_tenets.md"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Never publish a V_eta shape panel whose bundle lost part of the tree.
      - run: node scripts/check-veta-bundle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
