name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "schemas/V_*/**"
      # `schemas/V_*/**` needs a directory segment, so it matches
      # schemas/V_eta/stable/foo.json but NOT the generated ledger, which is a
      # file sitting directly under schemas/. Without this line a commit that
      # only re-runs tools/coverage.py updates the ledger and deploys nothing,
      # and the viewer's Coverage panel drifts behind the schemas with no signal
      # that it has.
      - "schemas/V_*_coverage_ledger.json"
      # Same trap, same reason: the decision families are a file directly under
      # schemas/, so `schemas/V_*/**` does not match them either. Without this
      # line, signing off a family or landing its build would update the
      # artifact the viewer reads and deploy nothing -- and the viewer would go
      # on showing a settled family as open, which is the precise failure the
      # artifact was added to remove.
      - "schemas/V_*_decisions.json"
      # The V_eta shape panel's two markdown inputs (web/src/veta/sources.ts),
      # imported at build time. Same trap as the two files above: without
      # these lines, regenerating the final class set or editing a tenet would
      # deploy nothing and the panel would go on showing the old text.
      - "schemas/V_eta_final_class_set.md"
      - "schemas/V_eta_tenets.md"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Never publish a V_eta shape panel whose bundle lost part of the tree.
      - run: node scripts/check-veta-bundle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
