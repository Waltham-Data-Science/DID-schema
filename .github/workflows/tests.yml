name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED, DELIBERATELY. This was `pip install ruff`, and on 2026-08-09 the
      # gate went red across FIVE test files with no code change: ruff 0.16.2
      # shipped and promoted UP031, RUF015, RUF059, SIM102, SIM115 and I001 to
      # its default set. 25 errors appeared at once, most of them in files
      # nobody had touched in months, and the failure looked like it belonged to
      # whichever branch happened to push next.
      #
      # An unpinned linter is an unreviewed dependency that can fail the build
      # on someone else's release schedule. Pinned FORWARD to the version that
      # caught these -- all 25 are fixed -- not back to the one that missed them.
      # Bump it deliberately, with the fixes in the same commit.
      - run: pip install ruff==0.16.2
      - run: ruff check tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

      # Phase 1.3 (V_eta_ground_truth_plan.md) -- ENFORCING.
      #
      # Migrators were written against DID-schema's own V_alpha snapshot instead
      # of the real NDI templates, so many read fields no real document has and
      # emitted empty-but-valid documents that passed every gate. This check
      # compares each migrator's field reads against the NDI origin/main
      # templates and fails on any that still consumes an invented name.
      #
      # It ran report-only through Phase 2 because turning it red before any
      # migrator was fixed would just have blocked the pipeline. The confirmed
      # list is now empty -- 17 offenders closed, 12 resolved by a guard, 2
      # allow-listed as verified benign WITH the evidence and the condition that
      # would revoke that status -- so it enforces.
      #
      # It also fails on a GUARD GONE or an ALLOW-LIST STALE entry: a guard
      # removed by a later edit means the V_alpha shape would migrate silently
      # again, which is the original defect returning.
      - name: Migrator vocabulary must match the real NDI templates
        if: matrix.python-version == '3.12'
        run: python3 tools/check_migrator_vocabulary.py --enforce

      # THE STATUS BOARD MUST BE CURRENT.
      #
      # V_eta state used to live in 27 plan documents, a 400-line CLAUDE.md and a
      # 52-item task list, none of which agreed. Prose cannot be checked, so it
      # rots and is then cited as evidence -- "no session document exists
      # anywhere", "all 0-usage, safe to delete", "dissolved (rename/decompose)"
      # were all written claims that were wrong and that nothing could catch.
      #
      # schemas/V_eta_STATUS.md is DERIVED from the built schema set and the
      # coverage ledger, so it cannot drift. This check fails if it is stale, if
      # an in_progress class belongs to no decision family (an open question
      # nobody is tracking), or if a family claims a decision document that does
      # not exist.
      - name: V_eta status board must be current
        if: matrix.python-version == '3.12'
        run: python3 tools/status_board.py --check

      # #69, the cheap interim -- a RATCHET, not a fix.
      #
      # A subclass that redeclares an ancestor's field creates two live storage
      # locations for one fact, and nothing says which is authoritative. The
      # collision is invisible: resolvePlacement's check fires only within one
      # targetBlock, and the default placement puts ancestor and descendant in
      # DIFFERENT blocks, so a redeclaration never trips it. Nothing else checks
      # a cross-block duplicate name -- not the schema package, not the
      # validator, not this repo's tools. The docstring says it errors; the code
      # does not.
      #
      # The real fix (merge into the ancestor's entry, require the child to
      # NARROW) touches the meta-schema, the validator and fieldsFor's contract,
      # and rides with binding governance. Until then the count may fall freely
      # and may not grow -- so the eight known rows stay visible instead of
      # quietly becoming nine.
      - name: No new duplicate field declarations in a class chain
        if: matrix.python-version == '3.12'
        run: python3 tools/check_duplicate_field_declarations.py --enforce
