name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

      # Phase 1.3 (V_eta_ground_truth_plan.md) -- ENFORCING.
      #
      # Migrators were written against DID-schema's own V_alpha snapshot instead
      # of the real NDI templates, so many read fields no real document has and
      # emitted empty-but-valid documents that passed every gate. This check
      # compares each migrator's field reads against the NDI origin/main
      # templates and fails on any that still consumes an invented name.
      #
      # It ran report-only through Phase 2 because turning it red before any
      # migrator was fixed would just have blocked the pipeline. The confirmed
      # list is now empty -- 17 offenders closed, 12 resolved by a guard, 2
      # allow-listed as verified benign WITH the evidence and the condition that
      # would revoke that status -- so it enforces.
      #
      # It also fails on a GUARD GONE or an ALLOW-LIST STALE entry: a guard
      # removed by a later edit means the V_alpha shape would migrate silently
      # again, which is the original defect returning.
      - name: Migrator vocabulary must match the real NDI templates
        if: matrix.python-version == '3.12'
        run: python3 tools/check_migrator_vocabulary.py --enforce
